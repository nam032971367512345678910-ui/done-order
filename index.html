<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>DONE ORDER BUILDER • RGB NEON</title>

<style>

/* ==============================
   🌈 RGB NEON THEME
================================ */

*{
  box-sizing:border-box;
}

:root{
  --rgb-speed:7s;

  --bg:#05030a;
  --panel:rgba(12,8,22,.78);

  --white:#fff;
  --muted:#aaa2b8;

  --purple:#9d4dff;
  --pink:#ff35d1;
  --blue:#29bfff;
  --green:#30e69a;
  --red:#ff3d6e;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;

  padding:20px;

  color:white;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:#05030a;

  overflow-x:hidden;
}


/* =================================
   🌌 ANIMATED RGB BACKGROUND
================================= */

body::before{
  content:"";

  position:fixed;

  width:160%;
  height:160%;

  left:-30%;
  top:-30%;

  z-index:-3;

  background:
    linear-gradient(
      120deg,
      #5400ff,
      #a000ff,
      #ff00cc,
      #ff0059,
      #006cff,
      #00d9ff,
      #5400ff
    );

  background-size:500% 500%;

  animation:
    rgbBackground
    var(--rgb-speed)
    ease
    infinite;

  filter:blur(100px);

  opacity:.35;
}


@keyframes rgbBackground{

  0%{
    background-position:0% 50%;
  }

  25%{
    background-position:100% 50%;
  }

  50%{
    background-position:100% 100%;
  }

  75%{
    background-position:0% 100%;
  }

  100%{
    background-position:0% 50%;
  }

}


/* =================================
   ✨ LIGHT ORBS
================================= */

body::after{
  content:"";

  position:fixed;

  width:500px;
  height:500px;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(255,0,220,.14),
      transparent 70%
    );

  filter:blur(25px);

  animation:
    orbMove
    10s
    ease-in-out
    infinite;

  pointer-events:none;

  z-index:-2;
}


@keyframes orbMove{

  0%{
    transform:
      translate(-60%,-50%)
      scale(.8);
  }

  50%{
    transform:
      translate(20%,-40%)
      scale(1.25);
  }

  100%{
    transform:
      translate(-60%,-50%)
      scale(.8);
  }

}


/* =================================
   MAIN
================================= */

.wrap{
  width:100%;
  max-width:980px;

  margin:auto;
}


/* =================================
   CARD
================================= */

.card{

  position:relative;

  padding:20px;

  margin-bottom:16px;

  border-radius:22px;

  background:
    linear-gradient(
      rgba(13,8,25,.9),
      rgba(9,5,18,.9)
    )
    padding-box,

    linear-gradient(
      90deg,
      #812cff,
      #ff26d5,
      #ff3c78,
      #29bfff,
      #812cff
    )
    border-box;

  border:2px solid transparent;

  background-size:
    100% 100%,
    400% 100%;

  animation:
    cardRGB
    6s
    linear
    infinite;

  box-shadow:
    0 0 20px rgba(140,40,255,.16),
    0 20px 55px rgba(0,0,0,.55);

  backdrop-filter:blur(18px);

  overflow:hidden;
}


@keyframes cardRGB{

  0%{
    background-position:
      0 0,
      0% 50%;
  }

  50%{
    background-position:
      0 0,
      100% 50%;
  }

  100%{
    background-position:
      0 0,
      0% 50%;
  }

}


/* shine */

.card::before{

  content:"";

  position:absolute;

  top:-100%;
  left:-50%;

  width:30%;
  height:300%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.12),
      transparent
    );

  transform:rotate(20deg);

  animation:
    shine
    6s
    ease-in-out
    infinite;

  pointer-events:none;
}


@keyframes shine{

  0%{
    left:-70%;
  }

  50%{
    left:140%;
  }

  100%{
    left:140%;
  }

}


/* =================================
   TEXT
================================= */

h1{

  margin:
    0
    0
    6px;

  font-size:26px;

  letter-spacing:.6px;

  background:

    linear-gradient(
      90deg,
      #9b4dff,
      #ff38d5,
      #ff3979,
      #2fc5ff,
      #9b4dff
    );

  background-size:400% auto;

  -webkit-background-clip:text;

  background-clip:text;

  color:transparent;

  animation:
    textRGB
    5s
    linear
    infinite;

  text-shadow:
    0 0 25px rgba(170,50,255,.25);
}


@keyframes textRGB{

  to{
    background-position:
      400% center;
  }

}


h2{
  margin-top:0;
}


.sub{
  color:#aaa1b5;

  font-size:13px;
}


/* =================================
   FORM
================================= */

label{

  display:block;

  color:#c8bdd4;

  font-size:12px;

  margin:
    13px
    0
    7px;
}


input,
textarea,
select{

  width:100%;

  color:white;

  background:
    rgba(5,3,12,.78);

  border:
    1px solid
    rgba(170,80,255,.3);

  border-radius:12px;

  padding:12px;

  outline:none;

  transition:.25s;
}


input{
  height:44px;
}


textarea{
  min-height:95px;

  resize:vertical;
}


input::placeholder,
textarea::placeholder{
  color:#6e657a;
}


input:focus,
textarea:focus,
select:focus{

  border-color:#c34dff;

  box-shadow:

    0 0 8px
    rgba(180,50,255,.55),

    0 0 25px
    rgba(255,20,210,.2);

  transform:
    translateY(-1px);
}


.row{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:12px;
}


/* =================================
   BUTTONS
================================= */

.btns{

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:10px;

  margin-top:14px;
}


button,
.server-btn{

  position:relative;

  border:0;

  border-radius:12px;

  padding:12px 14px;

  color:white;

  font-weight:700;

  cursor:pointer;

  text-decoration:none;

  text-align:center;

  overflow:hidden;

  transition:.2s;

  background:
    linear-gradient(
      135deg,
      #25123c,
      #160a28
    );

  box-shadow:
    0 7px 20px rgba(0,0,0,.3);
}


button:hover,
.server-btn:hover{

  transform:
    translateY(-3px)
    scale(1.01);

  box-shadow:

    0 0 15px
    rgba(180,50,255,.35),

    0 10px 30px
    rgba(0,0,0,.4);
}


button:active,
.server-btn:active{

  transform:
    scale(.96);
}


/* =================================
   🌈 RGB PRIMARY BUTTON
================================= */

.primary{

  background:

    linear-gradient(
      90deg,
      #7200ff,
      #c000ff,
      #ff00cc,
      #ff246e,
      #7200ff
    );

  background-size:400% 100%;

  animation:
    buttonRGB
    4s
    linear
    infinite;

  box-shadow:

    0 0 15px
    rgba(170,50,255,.35),

    0 0 30px
    rgba(255,0,210,.15);
}


@keyframes buttonRGB{

  0%{
    background-position:0% 50%;
  }

  100%{
    background-position:400% 50%;
  }

}


/* =================================
   💜 SERVER BUTTON
================================= */

.server-box{

  text-align:center;

  padding:6px 0 2px;
}


.server-btn{

  display:block;

  width:100%;

  background:

    linear-gradient(
      90deg,
      #5865f2,
      #9b4dff,
      #ff39d4,
      #5865f2
    );

  background-size:400% 100%;

  animation:
    serverRGB
    5s
    linear
    infinite;

  box-shadow:

    0 0 20px
    rgba(88,101,242,.4),

    0 0 40px
    rgba(200,50,255,.18);
}


@keyframes serverRGB{

  0%{
    background-position:0% 50%;
  }

  100%{
    background-position:400% 50%;
  }

}


/* =================================
   GREEN
================================= */

.green{

  background:
    linear-gradient(
      90deg,
      #08794f,
      #18bd7d,
      #38e69c,
      #08794f
    );

  background-size:300% 100%;

  animation:
    greenRGB
    4s
    linear
    infinite;
}


@keyframes greenRGB{

  0%{
    background-position:0%;
  }

  100%{
    background-position:300%;
  }

}


/* =================================
   RED
================================= */

.danger{

  background:
    linear-gradient(
      90deg,
      #8c1944,
      #ff276d,
      #ff4d8a,
      #8c1944
    );

  background-size:300% 100%;

  animation:
    redRGB
    4s
    linear
    infinite;
}


@keyframes redRGB{

  to{
    background-position:
      300% 0;
  }

}


/* =================================
   LIST
================================= */

.list{

  display:grid;

  gap:10px;

  margin-top:14px;
}


.item{

  display:flex;

  align-items:center;

  gap:9px;

  padding:11px;

  border-radius:14px;

  background:
    rgba(10,5,20,.72);

  border:
    1px solid
    rgba(180,80,255,.2);

  transition:.25s;
}


.item:hover{

  transform:
    translateY(-2px);

  border-color:
    rgba(210,80,255,.7);

  box-shadow:
    0 0 22px
    rgba(160,50,255,.18);
}


.item-main{

  flex:1;

  min-width:0;
}


.item-title{

  font-weight:700;

  color:white;

  text-shadow:
    0 0 12px
    rgba(210,80,255,.3);
}


.item-msg{

  margin-top:4px;

  color:#968ba2;

  font-size:12px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}


.small{

  padding:
    8px 10px;

  font-size:12px;
}


/* =================================
   EMPTY
================================= */

.empty{

  color:#756b80;

  text-align:center;

  padding:22px;

  border:
    1px dashed
    rgba(180,80,255,.3);

  border-radius:12px;
}


/* =================================
   STATUS
================================= */

.status{

  min-height:22px;

  margin-top:13px;

  text-align:center;

  color:#cdbdde;

  font-size:12px;

  transition:.2s;
}


/* =================================
   NOTE
================================= */

.note{

  color:#776d84;

  font-size:11px;

  line-height:1.5;

  margin-top:10px;
}


/* =================================
   COLOR
================================= */

input[type="color"]{

  padding:4px;

  cursor:pointer;
}


/* =================================
   RIPPLE CLICK EFFECT
================================= */

.ripple{

  position:absolute;

  border-radius:50%;

  transform:scale(0);

  animation:
    rippleEffect
    .65s
    linear;

  background:
    rgba(255,255,255,.55);

  pointer-events:none;
}


@keyframes rippleEffect{

  to{

    transform:
      scale(5);

    opacity:0;

  }

}


/* =================================
   SUCCESS EFFECT
================================= */

.success{

  animation:
    successPulse
    .6s
    ease;
}


@keyframes successPulse{

  0%{
    transform:scale(1);
  }

  50%{

    transform:
      scale(1.05);

    box-shadow:
      0 0 35px
      rgba(50,255,170,.8);
  }

  100%{
    transform:scale(1);
  }

}


/* =================================
   MOBILE
================================= */

@media(max-width:650px){

  body{
    padding:12px;
  }


  .card{
    padding:16px;

    border-radius:18px;
  }


  h1{
    font-size:22px;
  }


  .row{
    grid-template-columns:1fr;
  }


  .btns{
    grid-template-columns:1fr;
  }


  .item{
    align-items:flex-start;

    flex-wrap:wrap;
  }


  .item-main{
    width:100%;

    flex-basis:100%;
  }

}


/* =================================
   REDUCED MOTION
================================= */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{

    animation-duration:.01ms!important;

    animation-iteration-count:1!important;

    scroll-behavior:auto!important;

  }

}

</style>
</head>


<body>


<div class="wrap">


<!-- =================================
     HEADER / WEBHOOK
================================= -->

<div class="card">

  <h1>
    ⚡ DONE ORDER BUILDER
  </h1>

  <div class="sub">
    🌈 RGB Neon • Auto Color • Discord Order System
  </div>


  <label>
    Discord Webhook
  </label>

  <input
    id="webhook"
    type="password"
    placeholder="Dán webhook mới vào đây"
  >


  <div class="row">


    <div>

      <label>
        Discord User ID để ping
        (tùy chọn)
      </label>

      <input
        id="userid"
        inputmode="numeric"
        placeholder="123456789012345678"
      >

    </div>


    <div>

      <label>
        Ảnh Embed URL
        (tùy chọn)
      </label>

      <input
        id="image"
        placeholder="https://.../image.jpg"
      >

    </div>


  </div>


  <div class="btns">


    <button
      class="primary"
      id="testBtn"
      type="button"
    >
      🔔 TEST WEBHOOK
    </button>


    <button
      class="green"
      id="addBtn"
      type="button"
    >
      ➕ THÊM DONE
    </button>


  </div>


  <div
    id="status"
    class="status"
    aria-live="polite"
  ></div>


  <div class="note">

    🔐 Webhook chỉ được lưu trong
    trình duyệt của bạn.
    Không dùng webhook đã từng bị lộ.

  </div>

</div>



<!-- =================================
     DISCORD SERVER
================================= -->

<div class="card">

  <div class="server-box">

    <div
      style="
        font-size:12px;
        color:#aaa0b8;
        margin-bottom:8px;
      "
    >
      💜 DISCORD SERVER
    </div>


    <a
      class="server-btn"
      href="https://discord.gg/QfSHWECJ2"
      target="_blank"
      rel="noopener noreferrer"
      id="serverBtn"
    >
      💜 THAM GIA SERVER DISCORD
    </a>

  </div>

</div>



<!-- =================================
     EDITOR
================================= -->

<div
  class="card"
  id="editor"
  style="display:none"
>


  <h2
    id="editorTitle"
    style="margin:0 0 8px"
  >
    ➕ Thêm Done
  </h2>


  <div class="row">


    <div>

      <label>
        Tên nút
      </label>

      <input
        id="name"
        placeholder="VD: 🐉 DONE KITSUNE"
      >

    </div>


    <div>

      <label>
        Tiêu đề Discord
      </label>

      <input
        id="title"
        placeholder="VD: 🐉 ĐƠN HÀNG"
      >

    </div>


  </div>


  <label>
    Nội dung thông báo
  </label>

  <textarea
    id="message"
    placeholder="VD: đã done Kitsune / mong quý khách ủng hộ típ nhé"
  ></textarea>


  <div class="row">


    <div>

      <label>
        Màu Embed
      </label>

      <input
        id="color"
        type="color"
        value="#9b4dff"
      >

    </div>


    <div>

      <label>
        Chế độ ping
      </label>

      <select id="pingMode">

        <option value="global">
          Dùng User ID ở trên
        </option>

        <option value="none">
          Không ping
        </option>

      </select>

    </div>


  </div>


  <div class="btns">


    <button
      class="primary"
      id="saveBtn"
      type="button"
    >
      💾 LƯU DONE
    </button>


    <button
      id="cancelBtn"
      type="button"
    >
      ✖ HỦY
    </button>


  </div>

</div>



<!-- =================================
     LIST
================================= -->

<div class="card">


  <h2 style="margin:0">
    📋 DANH SÁCH DONE
  </h2>


  <div
    class="sub"
    style="margin-top:4px"
  >
    Các nút được lưu tự động trên
    trình duyệt.
  </div>


  <div
    id="list"
    class="list"
  ></div>


</div>


</div>


<script>

/* =================================
   ELEMENT HELPER
================================= */

const $ =
  id =>
  document.getElementById(id);


/* =================================
   STATE
================================= */

let dones =
  JSON.parse(
    localStorage.getItem(
      "done_buttons"
    ) || "[]"
  );


let editing = -1;


/* =================================
   LOAD SETTINGS
================================= */

$("webhook").value =
  localStorage.getItem(
    "done_webhook"
  ) || "";


$("userid").value =
  localStorage.getItem(
    "done_userid"
  ) || "";


$("image").value =
  localStorage.getItem(
    "done_image"
  ) || "";


/* =================================
   STATUS
================================= */

function setStatus(text){

  $("status").textContent =
    text;

}


/* =================================
   SETTINGS
================================= */

function saveSettings(){

  localStorage.setItem(
    "done_webhook",
    $("webhook").value.trim()
  );

  localStorage.setItem(
    "done_userid",
    $("userid").value.trim()
  );

  localStorage.setItem(
    "done_image",
    $("image").value.trim()
  );

}


[
  "webhook",
  "userid",
  "image"
].forEach(id => {

  $(id).addEventListener(
    "change",
    saveSettings
  );

});


/* =================================
   RIPPLE
================================= */

document.addEventListener(
  "click",
  function(e){

    const button =
      e.target.closest(
        "button,.server-btn"
      );

    if(!button) return;


    const rect =
      button.getBoundingClientRect();


    const ripple =
      document.createElement(
        "span"
      );


    const size =
      Math.max(
        rect.width,
        rect.height
      );


    ripple.className =
      "ripple";


    ripple.style.width =
      size + "px";


    ripple.style.height =
      size + "px";


    ripple.style.left =
      (
        e.clientX -
        rect.left -
        size / 2
      ) + "px";


    ripple.style.top =
      (
        e.clientY -
        rect.top -
        size / 2
      ) + "px";


    button.appendChild(
      ripple
    );


    setTimeout(
      () =>
        ripple.remove(),
      700
    );

  }
);


/* =================================
   OPEN EDITOR
================================= */

function openEditor(index=-1){

  editing = index;

  $("editor").style.display =
    "block";


  if(index < 0){

    $("editorTitle").textContent =
      "➕ Thêm Done";


    $("name").value = "";


    $("title").value =
      "📦 ĐƠN HÀNG";


    $("message").value = "";


    $("color").value =
      "#9b4dff";


    $("pingMode").value =
      "global";

  }

  else{

    const d =
      dones[index];


    $("editorTitle").textContent =
      "✏️ Sửa Done";


    $("name").value =
      d.name;


    $("title").value =
      d.title;


    $("message").value =
      d.message;


    $("color").value =
      d.color ||
      "#9b4dff";


    $("pingMode").value =
      d.pingMode ||
      "global";

  }


  $("name").focus();


  window.scrollTo({

    top:
      document.body.scrollHeight,

    behavior:
      "smooth"

  });

}


/* =================================
   CLOSE EDITOR
================================= */

function closeEditor(){

  editing = -1;

  $("editor").style.display =
    "none";

}


/* =================================
   SAVE DONE
================================= */

function saveDone(){

  const d = {

    name:
      $("name")
      .value
      .trim(),

    title:
      $("title")
      .value
      .trim()
      ||
      "📦 ĐƠN HÀNG",

    message:
      $("message")
      .value
      .trim(),

    color:
      $("color").value,

    pingMode:
      $("pingMode").value

  };


  if(
    !d.name ||
    !d.message
  ){

    alert(
      "⚠️ Nhập tên nút và nội dung DONE trước."
    );

    return;

  }


  if(editing < 0){

    dones.push(d);

  }

  else{

    dones[editing] =
      d;

  }


  localStorage.setItem(
    "done_buttons",
    JSON.stringify(dones)
  );


  render();


  closeEditor();


  setStatus(
    "✅ Đã lưu nút DONE ✨"
  );

}


/* =================================
   DELETE
================================= */

function deleteDone(i){

  if(
    !confirm(
      "Xóa nút DONE này?"
    )
  )
    return;


  dones.splice(
    i,
    1
  );


  localStorage.setItem(
    "done_buttons",
    JSON.stringify(dones)
  );


  render();


  setStatus(
    "🗑️ Đã xóa DONE"
  );

}


/* =================================
   MOVE
================================= */

function move(i,dir){

  const j =
    i + dir;


  if(
    j < 0 ||
    j >= dones.length
  )
    return;


  [
    dones[i],
    dones[j]
  ] =
  [
    dones[j],
    dones[i]
  ];


  localStorage.setItem(
    "done_buttons",
    JSON.stringify(dones)
  );


  render();

}


/* =================================
   ESCAPE
================================= */

function esc(s){

  return String(s)
    .replace(
      /[&<>"']/g,
      m =>
      ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      })[m]
    );

}


/* =================================
   RENDER
================================= */

function render(){

  const box =
    $("list");


  if(
    !dones.length
  ){

    box.innerHTML =
      `
      <div class="empty">
        ✨ Chưa có nút DONE.
        <br>
        Bấm “THÊM DONE” để tạo.
      </div>
      `;

    return;

  }


  box.innerHTML =
    dones
      .map(
        (d,i) => `

        <div class="item">

          <div class="item-main">

            <div class="item-title">
              ${esc(d.name)}
            </div>

            <div class="item-msg">
              ${esc(d.message)}
            </div>

          </div>


          <button
            class="small primary send-btn"
            data-index="${i}"
            type="button"
          >
            🚀 GỬI
          </button>


          <button
            class="small edit-btn"
            data-index="${i}"
            type="button"
          >
            ✏️ SỬA
          </button>


          <button
            class="small up-btn"
            data-index="${i}"
            type="button"
          >
            ↑
          </button>


          <button
            class="small down-btn"
            data-index="${i}"
            type="button"
          >
            ↓
          </button>


          <button
            class="small danger delete-btn"
            data-index="${i}"
            type="button"
          >
            🗑️
          </button>

        </div>

        `
      )
      .join("");


  document
    .querySelectorAll(
      ".send-btn"
    )
    .forEach(btn => {

      btn.addEventListener(
        "click",
        () => {

          const index =
            Number(
              btn.dataset.index
            );

          sendDone(
            index,
            btn
          );

        }
      );

    });


  document
    .querySelectorAll(
      ".edit-btn"
    )
    .forEach(btn => {

      btn.addEventListener(
        "click",
        () =>
          openEditor(
            Number(
              btn.dataset.index
            )
          )
      );

    });


  document
    .querySelectorAll(
      ".up-btn"
    )
    .forEach(btn => {

      btn.addEventListener(
        "click",
        () =>
          move(
            Number(
              btn.dataset.index
            ),
            -1
          )
      );

    });


  document
    .querySelectorAll(
      ".down-btn"
    )
    .forEach(btn => {

      btn.addEventListener(
        "click",
        () =>
          move(
            Number(
              btn.dataset.index
            ),
            1
          )
      );

    });


  document
    .querySelectorAll(
      ".delete-btn"
    )
    .forEach(btn => {

      btn.addEventListener(
        "click",
        () =>
          deleteDone(
            Number(
              btn.dataset.index
            )
          )
      );

    });

}


/* =================================
   HEX COLOR
================================= */

function hexToInt(hex){

  return parseInt(
    hex.replace("#",""),
    16
  );

}


/* =================================
   PAYLOAD
================================= */

function makePayload(
  title,
  message,
  color,
  ping
){

  const embed = {

    title:
      title,

    description:
      message,

    color:
      hexToInt(
        color ||
        "#9b4dff"
      ),

    footer:{
      text:
        "🌈 Done Order Builder • RGB Neon"
    },

    timestamp:
      new Date()
      .toISOString()

  };


  const image =
    $("image")
    .value
    .trim();


  if(image){

    embed.image = {
      url:image
    };

  }


  const payload = {

    embeds:[
      embed
    ]

  };


  const id =
    $("userid")
    .value
    .trim();


  if(
    ping === "global" &&
    id
  ){

    if(
      !/^\d{15,25}$/.test(id)
    ){

      setStatus(
        "❌ User ID không hợp lệ"
      );

      return null;

    }


    payload.content =
      "<@" +
      id +
      ">";


    payload.allowed_mentions = {

      users:[
        id
      ]

    };

  }


  return payload;

}


/* =================================
   POST DISCORD
================================= */

async function post(
  payload,
  button=null
){

  saveSettings();


  const url =
    $("webhook")
    .value
    .trim();


  if(!url){

    setStatus(
      "❌ Chưa nhập webhook"
    );

    return false;

  }


  if(
    !/^https:\/\/(discord\.com|discordapp\.com)\/api\/webhooks\//
      .test(url)
  ){

    setStatus(
      "❌ Webhook không đúng định dạng"
    );

    return false;

  }


  setStatus(
    "⏳ Đang gửi Discord..."
  );


  try{

    const response =
      await fetch(
        url,
        {

          method:
            "POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(
              payload
            )

        }
      );


    if(
      response.ok ||
      response.status === 204
    ){

      setStatus(
        "✅ DONE ĐÃ GỬI DISCORD ✨"
      );


      if(button){

        button.classList.add(
          "success"
        );


        const old =
          button.innerHTML;


        button.innerHTML =
          "✅ ĐÃ GỬI";


        setTimeout(
          () => {

            button.classList.remove(
              "success"
            );

            button.innerHTML =
              old;

          },
          1300
        );

      }


      return true;

    }


    setStatus(
      "❌ Discord HTTP " +
      response.status
    );


    return false;

  }


  catch(error){

    setStatus(
      "❌ Trình duyệt chặn request (CORS)."
    );

    return false;

  }

}


/* =================================
   SEND DONE
================================= */

function sendDone(
  i,
  button
){

  const d =
    dones[i];


  const payload =
    makePayload(
      d.title,
      d.message,
      d.color,
      d.pingMode
    );


  if(payload){

    post(
      payload,
      button
    );

  }

}


/* =================================
   TEST WEBHOOK
================================= */

function testWebhook(){

  const payload =
    makePayload(
      "🔔 TEST DISCORD",
      "Webhook đang hoạt động! 🌈✨",
      "#9b4dff",
      "global"
    );


  if(payload){

    post(
      payload
    );

  }

}
